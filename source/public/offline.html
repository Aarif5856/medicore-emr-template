<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · MediCore EMR</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #0f172a;
        --muted: #64748b;
        --brand: #0ea5e9;
        --border: #e2e8f0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #020817;
          --fg: #f8fafc;
          --muted: #94a3b8;
          --border: #1e293b;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: var(--bg);
        color: var(--fg);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .card { max-width: 26rem; text-align: center; }
      .logo { width: 56px; height: 56px; border-radius: 14px; }
      h1 { margin: 1.5rem 0 0; font-size: 1.25rem; font-weight: 600; letter-spacing: -0.01em; }
      p { margin: 0.5rem 0 0; font-size: 0.875rem; line-height: 1.6; color: var(--muted); }
      button {
        margin-top: 1.5rem;
        padding: 0.55rem 1.1rem;
        font: inherit;
        font-size: 0.875rem;
        font-weight: 500;
        color: #fff;
        background: var(--brand);
        border: 0;
        border-radius: 0.5rem;
        cursor: pointer;
        transition: opacity 0.15s ease;
      }
      button:hover { opacity: 0.9; }
      .hint {
        margin-top: 1.75rem;
        padding-top: 1.25rem;
        border-top: 1px solid var(--border);
        font-size: 0.75rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="logo" src="/pwa-192x192.png" alt="MediCore EMR" />
      <h1>You're offline</h1>
      <p>
        MediCore EMR can't reach the server right now. Pages you've already visited are still
        available &mdash; reconnect to load the rest.
      </p>
      <button onclick="location.reload()">Try again</button>
      <p class="hint">MediCore EMR &middot; Aarif Web Studio</p>
    </div>
  </body>
</html>
