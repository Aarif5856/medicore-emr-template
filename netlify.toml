## Netlify configuration for MediCore EMR (TanStack Start + nitro)
##
## The build uses nitro's `netlify` preset (activated by the NETLIFY=true env
## var Netlify sets automatically, and mirrored in vite.config.ts). That preset
## emits static assets into `dist/` and the SSR handler as a Netlify Function
## under `.netlify/functions-internal/`, with the necessary catch-all redirect
## wired up automatically — no manual `/* -> /index.html` rule needed (and
## adding one would break SSR routes).

[build]
  command = "bun run build"
  publish = "dist"
